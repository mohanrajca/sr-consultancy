// ══════════════════════════════════════
// INVOICE FORM — GST Validation + Auto-detect
// ══════════════════════════════════════
function InvForm({data,onSave,onClose,customers,products,company,notify,invoiceCount,invoices=[]}){
  const initCom=getCommission(data||{});
  const[f,set]=useState(()=>({invoiceNumber:'',invoiceDate:today(),dueDate:'',invoiceType:'B2B',customerName:'',customerGstin:'',customerAddress:'',customerState:'',customerStateCode:'',customerPhone:'',items:[{productName:'',hsn:'',qty:1,unit:'NOS',rate:0,gstRate:18}],notes:'',...data,
    commission:{enabled:false,supplier:'',buyer:'',side:'Supplier',rate:0,gstRate:18,desc:'COMMISSION',sac:'996111',refs:[],...(initCom||{})},
    roundOff:data&&data.id?Math.abs((+data.grandTotal||0)-Math.round(+data.grandTotal||0))<0.005:true}));
  const[cs,setCs]=useState(f.customerName||'');
  const[showDD,setDD]=useState(false);
  const[gstinErr,setGstinErr]=useState('');
  const[pasteOpen,setPasteOpen]=useState(false);
  const[pasteTxt,setPasteTxt]=useState('');

  const GSTIN_RE=GSTIN_RX;
  const getStateFromGstin=(gstin)=>{if(!gstin||gstin.length<2)return null;return STATES.find(s=>s.c===gstin.substring(0,2))||null;};

  const onGstinChange=(val)=>{
    const v=val.toUpperCase().trim();
    set(p=>({...p,customerGstin:v}));setGstinErr('');
    if(v.length===15){
      if(!GSTIN_RE.test(v)){setGstinErr('Invalid GSTIN format');return;}
      const st=getStateFromGstin(v);
      if(st)set(p=>({...p,customerGstin:v,customerState:st.n,customerStateCode:st.c}));
      else setGstinErr('GSTIN state code '+v.substring(0,2)+' not recognized');
    }
    if(v.length===15&&GSTIN_RE.test(v))set(p=>({...p,invoiceType:'B2B'}));
    else if(v.length===0)set(p=>({...p,invoiceType:'B2CS'}));
  };
  const onStateChange=(stateName)=>{
    const st=STATES.find(x=>x.n===stateName);const newCode=st?.c||'';
    set(p=>({...p,customerState:stateName,customerStateCode:newCode}));
    if(f.customerGstin&&f.customerGstin.length>=2){
      const g=f.customerGstin.substring(0,2);
      if(newCode&&g!==newCode)setGstinErr('GSTIN state code ('+g+') does not match selected state ('+newCode+'). GSTIN first 2 digits must equal the state code.');
      else setGstinErr('');
    }
  };
  const selectCust=(c)=>{const cf=custFields(c);set(p=>({...p,...cf}));setCs(c.name);setDD(false);setGstinErr('');};
  const setCustByName=(name)=>{
    if(!name)return;const c=customers.find(x=>normName(x.name)===normName(name));
    if(c)selectCust(c);else{setCs(name);set(p=>({...p,customerName:name}));}
  };
  const fcusts=customers.filter(c=>c.name.toLowerCase().includes(cs.toLowerCase()));

  const updItem=(i,k,v)=>{
    const items=[...f.items];items[i]={...items[i],[k]:v};
    if(k==='productName'){const pr=products.find(p=>p.name===v);if(pr)items[i]={...items[i],hsn:pr.hsn,rate:pr.rate,gstRate:pr.gstRate,unit:pr.unit};}
    set(p=>({...p,items}));
  };
  const addItem=()=>set(p=>({...p,items:[...p.items,{productName:'',hsn:'',qty:1,unit:'NOS',rate:0,gstRate:18}]}));
  const remItem=(i)=>set(p=>({...p,items:p.items.filter((_,j)=>j!==i)}));

  // ── COMMISSION ──
  const com=f.commission;
  const setCom=(patch)=>set(p=>({...p,commission:{...p.commission,...patch}}));
  const comMT=sumMT(com.refs);
  const comItems=com.enabled?[{productName:com.desc||'COMMISSION',hsn:com.sac||'996111',qty:comMT,unit:'TON',rate:+com.rate||0,gstRate:+com.gstRate||0}]:null;
  const effItems=comItems||f.items;
  const others=useMemo(()=>computeCommission(invoices.filter(i=>i.id!==f.id).map(enrichInv)),[invoices,f.id]);
  const comSources=useMemo(()=>invoices.filter(i=>i.id!==f.id&&getCommission(i)).slice().reverse(),[invoices,f.id]);
  const refCheck=(r)=>{
    if(!r.no||!com.supplier)return null;
    const e=others.list.find(x=>x.key===normName(com.supplier)+'|'+normRef(r.no));if(!e)return null;
    const mine=com.side==='Buyer'?'buy':'sup',other=mine==='buy'?'sup':'buy';
    if(e[mine].length)return{t:'err',m:'Already billed to '+com.side.toLowerCase()+' in '+e[mine].map(x=>x.invNo).join(', ')};
    if(e[other].length&&Math.abs(e.mt-(+r.mt||0))>0.0005)return{t:'warn',m:'Tonnage differs from '+e[other][0].invNo+' ('+fMT(e.mt)+')'};
    if(e[other].length)return{t:'ok',m:'Matches '+(other==='buy'?'buyer':'supplier')+' inv '+e[other][0].invNo};
    return null;
  };
  const pickSide=(side)=>{setCom({side});setCustByName(side==='Buyer'?com.buyer:com.supplier);};
  const updRef=(i,k,v)=>setCom({refs:com.refs.map((r,j)=>j===i?{...r,[k]:v}:r)});
  const addRef=()=>setCom({refs:[...com.refs,{no:'',date:'',mt:''}]});
  const remRef=(i)=>setCom({refs:com.refs.filter((_,j)=>j!==i)});
  const doPaste=()=>{
    const got=parseRefLines(pasteTxt);
    if(!got.length){notify("No invoice lines recognised. Use one line per invoice, e.g. SALEM /065/26-27 – 30.590 mts","warning");return;}
    setCom({refs:[...com.refs.filter(r=>r.no||r.mt),...got]});setPasteTxt('');setPasteOpen(false);
    notify(got.length+" invoice lines added ("+fMT(sumMT(got))+" MT)","success");
  };
  const copyFrom=(id)=>{
    const src=invoices.find(i=>i.id===id);const c=getCommission(src);if(!c)return;
    const side=c.side==='Buyer'?'Supplier':'Buyer';
    setCom({supplier:c.supplier,buyer:c.buyer,side,refs:(c.refs||[]).map(r=>({...r}))});
    setCustByName(side==='Buyer'?c.buyer:c.supplier);
    notify("Copied "+(c.refs||[]).length+" invoice lines from "+src.invoiceNumber+" — now billing the "+side.toLowerCase(),"success");
  };
  const dupKeys=com.refs.map(r=>normRef(r.no)).filter((k,i,a)=>k&&a.indexOf(k)!==i);

  // ── GST SUPPLY TYPE ──
  const companyStateCode=(company.stateCode||'').trim();
  const custStateCode=(f.customerStateCode||'').trim();
  const supplyType=(!custStateCode||!companyStateCode)?'unknown':(custStateCode===companyStateCode?'intra':'inter');
  const isIGST=supplyType==='inter';

  let taxT=0,cgT=0,sgT=0,igT=0;
  effItems.forEach(it=>{const tx=(+it.qty||0)*(+it.rate||0);const g=tx*(+it.gstRate||0)/100;taxT+=tx;if(isIGST)igT+=g;else{cgT+=g/2;sgT+=g/2;}});
  const taxR=r2(taxT),cgR=isIGST?0:r2(cgT),sgR=isIGST?0:r2(sgT),igR=isIGST?r2(igT):0;
  const exact=r2(taxR+cgR+sgR+igR);
  const grand=f.roundOff?Math.round(exact):exact;
  const roundDiff=r2(grand-exact);
  const dupNo=f.invoiceNumber&&invoices.find(i=>i.id!==f.id&&normRef(i.invoiceNumber)===normRef(f.invoiceNumber)&&fyOf(parseD(i.invoiceDate))===fyOf(parseD(f.invoiceDate)));

  const doSave=()=>{
    if(!f.customerName){notify("Customer name is required","warning");return;}
    if(!com.enabled&&!f.items[0]?.productName){notify("Add at least one line item","warning");return;}
    if(!f.customerStateCode){notify("⚠ Place of Supply (customer state) is required for GST calculation","warning");return;}
    if(!companyStateCode){notify("⚠ Set your company state in Settings → Company Profile first","warning");return;}
    if(f.customerGstin&&f.customerGstin.length>0&&f.customerGstin.length!==15){notify("⚠ GSTIN must be exactly 15 characters","warning");return;}
    if(f.customerGstin&&f.customerGstin.length===15&&!GSTIN_RE.test(f.customerGstin)){notify("⚠ Invalid GSTIN format","warning");return;}
    if(f.customerGstin&&f.customerGstin.length===15&&!gstinChecksumOK(f.customerGstin)){notify("⚠ GSTIN "+f.customerGstin+" fails the check-digit test — please correct it","error");return;}
    if(f.customerGstin&&f.customerGstin.length===15){const sc=f.customerGstin.substring(0,2);if(sc!==f.customerStateCode){notify("⚠ GSTIN state code ("+sc+") does not match Place of Supply ("+f.customerStateCode+").","error");return;}}
    if(f.invoiceType==='B2B'&&(!f.customerGstin||f.customerGstin.length<15)){notify("⚠ B2B invoice requires a valid customer GSTIN","warning");return;}
    if(!f.invoiceDate){notify("Invoice date is required","warning");return;}
    if(dupNo){notify("Invoice number "+f.invoiceNumber+" already exists in this financial year","error");return;}
    let comClean=null;
    if(com.enabled){
      const refs=com.refs.filter(r=>String(r.no||'').trim()||r.mt);
      if(!com.supplier||!com.buyer){notify("Enter both the supplier and the buyer of the underlying sale","warning");return;}
      if(!refs.length){notify("Add at least one supplier invoice with tonnage","warning");return;}
      if(refs.some(r=>!String(r.no||'').trim()||!(+r.mt>0))){notify("Each reference line needs an invoice number and tonnage above zero","warning");return;}
      if(!(+com.rate>0)){notify("Enter the commission rate per MT","warning");return;}
      if(dupKeys.length){notify("Invoice "+dupKeys[0]+" is listed twice in the references","warning");return;}
      const hard=refs.map(refCheck).find(w=>w&&w.t==='err');if(hard){notify(hard.m+" — edit that invoice instead of billing again","error");return;}
      const party=com.side==='Buyer'?com.buyer:com.supplier;
      if(normName(f.customerName)!==normName(party)){notify("This invoice is set to bill the "+com.side.toLowerCase()+", so the customer must be "+party,"warning");return;}
      comClean={...com,enabled:true,rate:+com.rate,gstRate:+com.gstRate,refs:refs.map(r=>({no:String(r.no).trim(),date:r.date||'',mt:+r.mt}))};
    }
    const items=com.enabled?[{...comItems[0],commission:comClean}]:f.items.map(({commission,...it})=>it);
    const autoNote=com.enabled?'Commission on '+fMT(comMT)+' MT @ ₹'+com.rate+' per MT ('+fMT(comMT)+' × ₹'+com.rate+' = '+fCur(taxR)+')':'';
    onSave({...f,items,commission:comClean||{enabled:false},notes:f.notes||autoNote,invoiceType:f.invoiceType||'B2B',
      taxableAmount:taxR,cgstAmount:cgR,sgstAmount:sgR,igstAmount:igR,grandTotal:grand});
  };

  const supplyBadge=supplyType==='intra'
    ?{bg:'#ecfdf5',border:'#a7f3d0',color:'#065f46',icon:'✓',label:'Intra-State → CGST + SGST',detail:'Company ('+companyStateCode+') = Customer ('+custStateCode+')'}
    :supplyType==='inter'
    ?{bg:'#eff6ff',border:'#93c5fd',color:'#1e40af',icon:'↔',label:'Inter-State → IGST',detail:'Company ('+companyStateCode+') ≠ Customer ('+custStateCode+')'}
    :{bg:'#fffbeb',border:'#fde68a',color:'#92400e',icon:'?',label:'Select Place of Supply',detail:'Customer state needed for GST split'};
  const seg=(on)=>({flex:1,padding:'9px 12px',borderRadius:9,border:'1.5px solid '+(on?'#1e3a5f':'#e2e8f0'),background:on?'#1e3a5f':'#fff',color:on?'#fff':'#334155',cursor:'pointer',textAlign:'left',fontSize:13});
  const chk=(w)=>w?<span style={{fontSize:11,fontWeight:600,color:w.t==='err'?'#dc2626':w.t==='warn'?'#b45309':'#059669'}}>{w.t==='ok'?'✓ ':'⚠ '}{w.m}</span>:null;

  return <div>
    <div style={{padding:'10px 16px',borderRadius:10,background:supplyBadge.bg,border:'1.5px solid '+supplyBadge.border,marginBottom:16,display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
      <span style={{fontSize:18}}>{supplyBadge.icon}</span>
      <div><div style={{fontSize:13,fontWeight:700,color:supplyBadge.color}}>{supplyBadge.label}</div><div style={{fontSize:11,color:supplyBadge.color,opacity:.75}}>{supplyBadge.detail}</div></div>
      <div style={{marginLeft:'auto',display:'flex',gap:6}}>
        {com.enabled&&<span style={{padding:'3px 10px',borderRadius:6,fontSize:11,fontWeight:700,background:'#c9a227',color:'#1e3a5f'}}>Commission</span>}
        <span style={{padding:'3px 10px',borderRadius:6,fontSize:11,fontWeight:700,background:f.invoiceType==='B2B'?'#1e3a5f':'#64748b',color:'#fff'}}>{f.invoiceType||'—'}</span>
      </div>
    </div>

    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
      <div><label style={S.lbl}>Invoice Type</label><select style={S.inp} value={f.invoiceType} onChange={e=>set(p=>({...p,invoiceType:e.target.value}))}><option value="B2B">B2B (Registered)</option><option value="B2CS">B2CS (Unregistered)</option><option value="Credit Note">Credit Note</option><option value="Debit Note">Debit Note</option><option value="Export">Export</option></select></div>
      <div><label style={S.lbl}>Invoice #</label><input style={{...S.inp,borderColor:dupNo?'#ef4444':'#e2e8f0'}} value={f.invoiceNumber} onChange={e=>set(p=>({...p,invoiceNumber:e.target.value}))} placeholder={"Next: "+nextInvNo(invoices.filter(i=>i.id!==f.id),f.invoiceDate)}/>
        {dupNo&&<div style={{fontSize:11,color:'#ef4444',marginTop:4,fontWeight:600}}>⚠ Already used in this FY</div>}</div>
      <div><label style={S.lbl}>Date *</label><input style={S.inp} type="date" value={f.invoiceDate} onChange={e=>set(p=>({...p,invoiceDate:e.target.value}))}/></div>
      <div><label style={S.lbl}>Due Date</label><input style={S.inp} type="date" value={f.dueDate} onChange={e=>set(p=>({...p,dueDate:e.target.value}))}/></div>
    </div>

    {/* ★ COMMISSION ON TONNAGE ★ */}
    <div style={{marginTop:20,borderRadius:12,border:'1.5px solid '+(com.enabled?'#c9a227':'#e2e8f0'),background:com.enabled?'#fffcf2':'#fff'}}>
      <label style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',cursor:'pointer'}}>
        <input type="checkbox" checked={!!com.enabled} onChange={e=>setCom({enabled:e.target.checked})} style={{width:18,height:18,accentColor:'#1e3a5f'}}/>
        <div><div style={{fontSize:14,fontWeight:700,color:'#1e3a5f'}}>Commission invoice on tonnage</div>
          <div style={{fontSize:12,color:'#64748b'}}>Bill commission per MT against the supplier's sale invoices, and track which side has been billed</div></div>
      </label>
      {com.enabled&&<div style={{padding:'0 16px 16px'}}>
        <datalist id="party-list">{customers.map(c=><option key={c.id} value={c.name}/>)}</datalist>
        {comSources.length>0&&<div style={{marginBottom:12}}>
          <label style={S.lbl}>Start from an earlier commission invoice <span style={{fontWeight:400,color:'#94a3b8'}}>(copies the same supplier invoices and switches to the other side)</span></label>
          <select style={S.inp} value="" onChange={e=>e.target.value&&copyFrom(e.target.value)}>
            <option value="">Choose invoice…</option>
            {comSources.map(i=>{const c=getCommission(i);return <option key={i.id} value={i.id}>{i.invoiceNumber} · {i.customerName} ({c.side}) · {(c.refs||[]).length} inv · {fMT(sumMT(c.refs))} MT</option>;})}
          </select>
        </div>}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div><label style={S.lbl}>Supplier (seller / billed from) *</label><input list="party-list" style={S.inp} value={com.supplier} placeholder="e.g. RAUNAQ STEELS TRADING PVT LTD" onChange={e=>setCom({supplier:e.target.value})}/></div>

            <tbody>
              {com.refs.map((r,i)=>{const w=refCheck(r);const dup=r.no&&dupKeys.includes(normRef(r.no));return <tr key={i}>

                <td style={{...S.td,padding:'6px 6px',width:150}}><input type="date" style={{...S.inp,padding:'7px 8px',fontSize:13}} value={r.date||''} onChange={e=>updRef(i,'date',e.target.value)}/></td>

                <td style={{...S.td,padding:'6px 10px',minWidth:120}}>{dup?<span style={{fontSize:11,fontWeight:600,color:'#dc2626'}}>⚠ Listed twice</span>:chk(w)}</td>

              </tr>;})}
              {!com.refs.length&&<tr><td colSpan={6} style={{...S.td,textAlign:'center',color:'#94a3b8',padding:20}}>Add the supplier's invoices this commission is based on — type them in or use Paste list</td></tr>}

    <div style={{marginTop:20,padding:16,background:'#f8fafc',borderRadius:12,border:'1px solid #e2e8f0'}}>

          {gstinErr&&<div style={{fontSize:11,color:'#ef4444',marginTop:4,fontWeight:600}}>⚠ {gstinErr}</div>}
          {f.customerGstin&&f.customerGstin.length===15&&!gstinErr&&GSTIN_RE.test(f.customerGstin)&&(gstinChecksumOK(f.customerGstin)?<div style={{fontSize:11,color:'#059669',marginTop:4,fontWeight:600}}>✓ Valid GSTIN (check digit OK) — State auto-filled from code {f.customerGstin.substring(0,2)}</div>:<div style={{fontSize:11,color:'#b45309',marginTop:4,fontWeight:600}}>⚠ Check digit doesn't match — re-check the GSTIN for a typo</div>)}
        </div>
        <div><label style={S.lbl}>Phone</label><input style={S.inp} value={f.customerPhone} onChange={e=>set(p=>({...p,customerPhone:e.target.value}))}/></div>
        <div style={{gridColumn:'1/-1'}}><label style={S.lbl}>Address</label><input style={S.inp} value={f.customerAddress} onChange={e=>set(p=>({...p,customerAddress:e.target.value}))}/></div>
        <div>
          <label style={S.lbl}>Place of Supply (State) *</label>
          <select style={{...S.inp,borderColor:!f.customerStateCode?'#d97706':'#e2e8f0'}} value={f.customerState} onChange={e=>onStateChange(e.target.value)}>
            <option value="">⚠ Select State</option>{STATES.map(s=><option key={s.c} value={s.n}>{s.n} ({s.c})</option>)}
          </select>
          {!f.customerStateCode&&<div style={{fontSize:11,color:'#d97706',marginTop:4,fontWeight:600}}>⚠ Required — determines CGST+SGST vs IGST</div>}
        </div>
        <div><label style={S.lbl}>State Code</label><input readOnly style={{...S.inp,background:'#f1f5f9',fontFamily:'monospace',fontSize:16,fontWeight:700,letterSpacing:2,color:f.customerStateCode?'#1e3a5f':'#94a3b8'}} value={f.customerStateCode||'—'}/></div>
      </div>
    </div>

    {/* LINE ITEMS */}
    <div style={{marginTop:20}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <h4 style={{margin:0,fontSize:14,fontWeight:700,color:'#475569'}}>📦 Line Items</h4>
        {!com.enabled&&<button style={{...S.btnS,padding:'6px 12px',fontSize:13}} onClick={addItem}><Ic name="plus" size={14}/> Add Item</button>}
      </div>
      {com.enabled?<div style={{padding:12,background:'#f8fafc',borderRadius:10,border:'1px solid #e2e8f0',display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr 1fr',gap:8,fontSize:13}}>
        <div><div style={{...S.lbl,fontSize:11}}>Description</div><b>{comItems[0].productName}</b><div style={{fontSize:11,color:'#64748b'}}>SAC {comItems[0].hsn}</div></div>
        <div><div style={{...S.lbl,fontSize:11}}>Qty</div>{fMT(comMT)} TON</div>
        <div><div style={{...S.lbl,fontSize:11}}>Rate</div>{fCur(comItems[0].rate)}</div>
        <div><div style={{...S.lbl,fontSize:11}}>GST</div>{comItems[0].gstRate}%</div>
        <div><div style={{...S.lbl,fontSize:11}}>Amount</div><b style={{color:'#1e3a5f'}}>{fCur(taxR)}</b></div>
        <div style={{gridColumn:'1/-1',fontSize:11,color:'#94a3b8'}}>Built from the commission section above</div>
      </div>:
      f.items.map((it,i)=><div key={i} style={{padding:12,background:'#f8fafc',borderRadius:10,border:'1px solid #e2e8f0',marginBottom:8}}>
        <div style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr 1fr 1fr auto',gap:8,alignItems:'end'}}>
          <div><label style={{...S.lbl,fontSize:11}}>Product</label><select style={{...S.inp,fontSize:13}} value={it.productName} onChange={e=>updItem(i,'productName',e.target.value)}><option value="">Select...</option>{products.map(p=><option key={p.id} value={p.name}>{p.name}</option>)}</select></div>
          <div><label style={{...S.lbl,fontSize:11}}>HSN</label><input style={{...S.inp,fontSize:13}} value={it.hsn||''} onChange={e=>updItem(i,'hsn',e.target.value)}/></div>
          <div><label style={{...S.lbl,fontSize:11}}>Qty ({it.unit||'NOS'})</label><input style={{...S.inp,fontSize:13}} type="number" min="0" step="any" value={it.qty} onChange={e=>updItem(i,'qty',+e.target.value)}/></div>
          <div><label style={{...S.lbl,fontSize:11}}>Rate</label><input style={{...S.inp,fontSize:13}} type="number" value={it.rate} onChange={e=>updItem(i,'rate',+e.target.value)}/></div>
          <div><label style={{...S.lbl,fontSize:11}}>GST%</label><select style={{...S.inp,fontSize:13}} value={it.gstRate} onChange={e=>updItem(i,'gstRate',+e.target.value)}>{GST_RATES.map(r=><option key={r} value={r}>{r}%</option>)}</select></div>
          <div><label style={{...S.lbl,fontSize:11}}>Amount</label><div style={{padding:'10px 0',fontWeight:700,fontSize:13,color:'#1e3a5f'}}>{fCur((it.qty||0)*(it.rate||0))}</div></div>
          {f.items.length>1&&<button style={{background:'none',border:'none',cursor:'pointer',color:'#ef4444',padding:6,alignSelf:'end'}} onClick={()=>remItem(i)}><Ic name="x" size={16}/></button>}
        </div>
      </div>)}

    {/* TOTALS */}
    <div style={{marginTop:16,padding:16,background:'#1e3a5f',borderRadius:12,color:'#fff'}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10,padding:'6px 12px',background:'rgba(255,255,255,.08)',borderRadius:8}}>

        <span style={{fontSize:12,fontWeight:600,opacity:.9}}>{isIGST?'Inter-State Supply → IGST':'Intra-State Supply → CGST + SGST'}</span>
        <span style={{marginLeft:'auto',fontSize:11,opacity:.6}}>Company: {companyStateCode} | Customer: {custStateCode||'?'}</span>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',padding:'4px 0',fontSize:14}}><span>Taxable Amount</span><span style={{fontWeight:600}}>{fCur(taxR)}</span></div>
      {!isIGST&&<><div style={{display:'flex',justifyContent:'space-between',padding:'4px 0',fontSize:14}}><span>CGST</span><span>{fCur(cgR)}</span></div>
        <div style={{display:'flex',justifyContent:'space-between',padding:'4px 0',fontSize:14}}><span>SGST</span><span>{fCur(sgR)}</span></div></>}
      {isIGST&&<div style={{display:'flex',justifyContent:'space-between',padding:'4px 0',fontSize:14}}><span>IGST</span><span>{fCur(igR)}</span></div>}
      <label style={{display:'flex',justifyContent:'space-between',padding:'4px 0',fontSize:14,cursor:'pointer'}}>
        <span><input type="checkbox" checked={!!f.roundOff} onChange={e=>set(p=>({...p,roundOff:e.target.checked}))} style={{marginRight:8,accentColor:'#c9a227'}}/>Round off to nearest rupee</span>
        <span>{roundDiff?(roundDiff<0?'(−) ':'(+) ')+fCur(Math.abs(roundDiff)):'—'}</span></label>
      <div style={{display:'flex',justifyContent:'space-between',padding:'8px 0 0',fontSize:18,fontWeight:800,borderTop:'1px solid rgba(255,255,255,.2)',marginTop:8}}><span>Grand Total</span><span>{fCur(grand)}</span></div>
      <div style={{fontSize:12,color:'rgba(255,255,255,.6)',marginTop:4}}>{numWords(grand)}</div>
    </div>

    <div style={{marginTop:16}}><label style={S.lbl}>Notes {com.enabled&&<span style={{fontWeight:400,color:'#94a3b8'}}>(left blank, the commission working is added automatically)</span>}</label><textarea style={{...S.inp,minHeight:50}} value={f.notes||''} onChange={e=>set(p=>({...p,notes:e.target.value}))}/></div>
    <div style={{display:'flex',gap:12,justifyContent:'flex-end',marginTop:20}}>
      <button style={S.btnS} onClick={onClose}>Cancel</button>
      <button style={S.btnP} onClick={doSave}><Ic name="save" size={16}/> {data?.id?'Update':'Create'} Invoice & Sync</button>
    </div>
  </div>;
}

// ── Expense Form ──
function ExpForm({data,onSave,onClose}){
  const[f,set]=useState({voucherNo:'',date:today(),category:'',vendor:'',amount:0,gstRate:0,paymentMethod:'Cash',description:'',...data});
  const gst=(+f.amount||0)*(+f.gstRate||0)/100;const total=(+f.amount||0)+gst;
  return <div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
      <div><label style={S.lbl}>Voucher #</label><input style={S.inp} value={f.voucherNo} onChange={e=>set(p=>({...p,voucherNo:e.target.value}))}/></div>
      <div><label style={S.lbl}>Date</label><input style={S.inp} type="date" value={f.date} onChange={e=>set(p=>({...p,date:e.target.value}))}/></div>
      <div><label style={S.lbl}>Category</label><select style={S.inp} value={f.category} onChange={e=>set(p=>({...p,category:e.target.value}))}><option value="">Select</option>{EXP_CATS.map(c=><option key={c}>{c}</option>)}</select></div>
      <div><label style={S.lbl}>Vendor</label><input style={S.inp} value={f.vendor} onChange={e=>set(p=>({...p,vendor:e.target.value}))}/></div>
      <div><label style={S.lbl}>Amount ₹</label><input style={S.inp} type="number" value={f.amount} onChange={e=>set(p=>({...p,amount:+e.target.value}))}/></div>
      <div><label style={S.lbl}>GST %</label><select style={S.inp} value={f.gstRate} onChange={e=>set(p=>({...p,gstRate:+e.target.value}))}>{GST_RATES.map(r=><option key={r} value={r}>{r}%</option>)}</select></div>
      <div><label style={S.lbl}>Payment Method</label><select style={S.inp} value={f.paymentMethod} onChange={e=>set(p=>({...p,paymentMethod:e.target.value}))}><option>Cash</option><option>Bank</option><option>UPI</option><option>Cheque</option><option>Card</option></select></div>
      <div><label style={S.lbl}>Total</label><div style={{padding:'10px 0',fontWeight:700,fontSize:16,color:'#059669'}}>{fCur(total)}</div></div>
    </div>
    <div style={{display:'flex',gap:12,justifyContent:'flex-end',marginTop:20}}>
      <button style={S.btnS} onClick={onClose}>Cancel</button>
      <button style={S.btnP} onClick={()=>onSave({...f,gstAmount:Math.round(gst*100)/100,total:Math.round(total*100)/100})}><Ic name="save" size={16}/> Save & Sync</button>
    </div>
  </div>;
}

// ACCOUNTS — statement, bills vs receipts, raised vs pending, GST validation
// ══════════════════════════════════════
function printStatement(company,party,st,from,to,openBills){
  const row=(e)=>'<tr><td>'+(e.d?fDate(e.d):'')+'</td><td>'+esc(e.type)+'</td><td>'+esc(e.ref)+'</td><td>'+esc(e.part)+'</td><td class="r">'+(e.dr?fCur(e.dr):'')+'</td><td class="r">'+(e.cr?fCur(e.cr):'')+'</td><td class="r">'+fBal(e.bal)+'</td></tr>';
  const ob=openBills.length?'<h2>Bills pending</h2><table><thead><tr><th>Date</th><th>Invoice no</th><th class="r">Invoice value</th><th class="r">Received</th><th class="r">TDS</th><th class="r">Pending</th><th class="r">Days</th></tr></thead><tbody>'+
    openBills.map(b=>'<tr><td>'+fDate(b.invoiceDate)+'</td><td>'+esc(b.invoiceNumber)+'</td><td class="r">'+fCur(b.value)+'</td><td class="r">'+fCur(b.cash)+'</td><td class="r">'+fCur(b.tdsA)+'</td><td class="r"><b>'+fCur(b.pending)+'</b></td><td class="r">'+b.days+'</td></tr>').join('')+
    '<tr class="t"><td colspan="5">Total pending</td><td class="r">'+fCur(sumBy(openBills,'pending'))+'</td><td></td></tr></tbody></table>':'';
  const w=window.open('','','width=1000,height=800');
  w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Statement — '+esc(party.name)+'</title><style>@page{size:A4;margin:12mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{font-family:Arial,sans-serif;color:#1a1a2e;font-size:11px;margin:0}'+
    '.h{display:flex;justify-content:space-between;border-bottom:3px solid #c9a227;padding-bottom:10px;margin-bottom:12px}.h h1{font-size:17px;margin:0;color:#1e3a5f}.h p{margin:2px 0;color:#555}h2{font-size:12px;color:#1e3a5f;margin:18px 0 6px;text-transform:uppercase;letter-spacing:1px}'+
    'table{width:100%;border-collapse:collapse}th{background:#1e3a5f;color:#fff;padding:6px;font-size:9.5px;text-align:left}th.r,td.r{text-align:right}td{padding:5px 6px;border-bottom:1px solid #e5e7eb;vertical-align:top}tr.t td{font-weight:bold;border-top:2px solid #1e3a5f;background:#f8fafc}tr.o td{background:#f8fafc;font-style:italic}.foot{margin-top:24px;font-size:10px;color:#777}</style></head><body>'+
    '<div class="h"><div><h1>'+esc(company.companyName||'')+'</h1><p>GSTIN '+esc(company.gstin||'—')+' · '+esc(company.city||'')+'</p></div><div style="text-align:right"><h1>Statement of account</h1><p>'+(from?fDate(from):'Beginning')+' to '+(to?fDate(to):'date')+'</p></div></div>'+
    '<p><b>'+esc(party.name)+'</b>'+(party.gstin?' · GSTIN '+esc(party.gstin):'')+'</p>'+
    '<table><thead><tr><th>Date</th><th>Type</th><th>Ref</th><th>Particulars</th><th class="r">Debit</th><th class="r">Credit</th><th class="r">Balance</th></tr></thead><tbody>'+
    '<tr class="o"><td colspan="6">Opening balance</td><td class="r">'+fBal(st.opening)+'</td></tr>'+st.rows.map(row).join('')+
    '<tr class="t"><td colspan="4">Total / closing balance</td><td class="r">'+fCur(st.dr)+'</td><td class="r">'+fCur(st.cr)+'</td><td class="r">'+fBal(st.closing)+'</td></tr></tbody></table>'+ob+
    '<p class="foot">Dr balance = amount due to '+esc(company.companyName||'us')+'. TDS shown as credit is as reported by the party; please share Form 16A. Kindly confirm the balance or report differences within 15 days.</p></body></html>');
  w.document.close();setTimeout(()=>w.print(),350);
}

function Accounts({invoices,receipts,company,onView,onReceive}){

  // ── Raised vs pending ──
  if(tab==='summary'){
    const rows=A.list.map(p=>{const b=p.bills.filter(keep);const raised=sumBy(b,'value'),pending=sumBy(b,'pending');const open=b.filter(x=>x.pending>0.5);
      return {_key:p._key,name:p.name,count:b.length,raised,cash:sumBy(b,'cash'),tds:sumBy(b,'tdsA'),cn:sumBy(b,'cnA'),pending,pct:raised?(raised-pending)/raised*100:0,
        oldest:open.length?Math.max(...open.map(x=>x.days)):0,over90:sumBy(open.filter(x=>x.days>90),'pending'),advance:p.advance};}).filter(r=>r.count||r.advance>0.5).sort((a,b)=>b.pending-a.pending||b.raised-a.raised);
    const T={count:sumBy(rows,'count'),raised:sumBy(rows,'raised'),cash:sumBy(rows,'cash'),tds:sumBy(rows,'tds'),cn:sumBy(rows,'cn'),pending:sumBy(rows,'pending'),advance:sumBy(rows,'advance')};
    const pctAll=T.raised?(T.raised-T.pending)/T.raised*100:0;

      {k:'recs',l:'Receipts applied',wrap:1,render:r=>r.recs.length?<div style={{fontSize:12,color:'#475569'}}>{r.recs.map((x,i)=><div key={i}>{x.no} · {x.date?fDate(x.date):''} · {fCur(x.cash+x.tds+x.cn)}{x.tds?' (TDS '+fCur(x.tds)+')':''}{x.cn?' (CN)':''}</div>)}</div>:<span style={{color:'#cbd5e1'}}>—</span>,
        csv:r=>r.recs.map(x=>x.no+' '+(x.date?fDate(x.date):'')+' '+r2(x.cash+x.tds+x.cn)).join('; ')},
      {k:'act',l:'',render:r=>r.pending>0.5?<button style={{...S.btnS,...S.btnSm,fontSize:12,whiteSpace:'nowrap'}} onClick={e=>{e.stopPropagation();onReceive(r);}}>Record receipt</button>:null,csv:()=>''}];
    const tot={value:sumBy(rows,'value'),cash:sumBy(rows,'cash'),tdsA:sumBy(rows,'tdsA'),pending:sumBy(rows,'pending')};
    const title='Bills vs receipts';const sub=(fy==='All'?'All years':'FY '+fy)+' · '+status+(party!=='All'?' · '+(A.parties[party]?.name||''):'');
    const exCols=cols.filter(c=>c.k!=='act');
    return <div>{head('',title+' — bill-wise settlement',<>{btnX(()=>downloadCSV(title+' '+sub,exCols,rows,tot))}{btnP(()=>printTable(title,sub,exCols,rows,tot,company))}</>)}

        <select aria-label="Status" style={sel} value={status} onChange={e=>setStatus(e.target.value)}>{[['Pending','Pending (unpaid + part paid)'],['Unpaid','Unpaid'],['Part paid','Part paid'],['Paid','Paid'],['All','All bills']].map(([v,l])=><option key={v} value={v}>{l}</option>)}</select>

        <span style={{alignSelf:'center',fontSize:13,color:'#64748b'}}>{rows.length} bills · {fCur(tot.pending)} pending</span>
      </div>
      <RTable cols={cols} rows={rows} totals={tot} onRow={onView} minWidth={1150}/>

    </div>;
  }

  // ── Party statement ──
  if(tab==='statement'){
    const stKey=A.parties[stParty]?stParty:(A.list.slice().sort((a,b)=>b.pending-a.pending)[0]?._key||'');

    return <div>{head('','Statement of account — commission invoiced and payments received',p&&<>
        {btnX(()=>downloadCSV('Statement '+p.name+' '+from+' to '+to,cols,rows,tot))}

        <label style={{fontSize:13,color:'#475569'}}>To <input type="date" style={{...sel,marginLeft:4}} value={to} onChange={e=>setTo(e.target.value)}/></label>
        {fys.map(y=><button key={y} style={{...S.btnS,...S.btnSm,fontSize:12}} onClick={()=>{setFrom(fyStart(y));setTo((+y.slice(0,4)+1)+'-03-31');}}>FY {y}</button>)}
      </div>
      {p&&<div style={{...S.card,display:'flex',flexWrap:'wrap',marginBottom:14}}>
        <Stat label="Opening balance" value={fBal(st.opening)}/>
        <Stat label="Invoiced in period" value={fCur(st.dr)} sub={st.rows.filter(r=>r.type==='Invoice').length+' invoices'}/>
        <Stat label="Received + TDS in period" value={fCur(st.cr)} sub={'TDS '+fCur(sumBy(st.rows.filter(r=>r.type==='TDS'),'cr'))}/>
        <Stat label="Closing balance" value={fBal(st.closing)} sub={openBills.length+' bills pending · oldest '+p.oldest+' days'}/>
      </div>}

      {p&&<p style={{fontSize:12,color:'#94a3b8',marginTop:8}}>Debit = invoices raised on {p.name}; credit = amounts received, TDS deducted and credit notes. The printout adds a bill-wise pending list for the party to confirm.</p>}

  // ── GST validation ──
  const checked=einv.filter(i=>fy==='All'||i._fy===fy).filter(i=>!comOnly||i._com).map(i=>({...i,_g:gstCheck(i,company)})).sort((a,b)=>((a._d||0)-(b._d||0)));
  const bad=checked.filter(i=>!i._g.ok);const rows=issuesOnly?bad:checked;
  const intra=checked.filter(i=>i._g.supply==='intra'),inter=checked.filter(i=>i._g.supply==='inter');
  const cols=[{k:'d',l:'Date',render:r=>fDate(r.invoiceDate),csv:r=>fDate(r.invoiceDate)},{k:'invoiceNumber',l:'Invoice no',bold:1,color:'#1e3a5f'},{k:'customerName',l:'Party',bold:1,wrap:1},
    {k:'pos',l:'POS',render:r=>r.customerStateCode||'—',csv:r=>r.customerStateCode},{k:'exp',l:'Should be',render:r=>r._g.expected,csv:r=>r._g.expected},

        <thead><tr>{['Supply','Invoices','Taxable','CGST / IGST','SGST'].map((h,i)=><th key={h} style={{...S.th,padding:'8px 10px',textAlign:i?'right':'left'}}>{h}</th>)}</tr></thead>
        <tbody>{sumRow('Intra-state',intra,fCur(sumBy(intra,'_cgst')),fCur(sumBy(intra,'_sgst')))}{sumRow('Inter-state',inter,fCur(sumBy(inter,'_igst')),'—')}</tbody></table>
        <div style={{fontSize:11.5,color:'#94a3b8',padding:'4px 10px 10px'}}>Outward taxable supplies for GSTR-3B Table 3.1(a), net of credit notes</div></div>
    </div>
    <label style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:13,marginBottom:10,cursor:'pointer'}}><input type="checkbox" checked={issuesOnly} onChange={e=>setIssuesOnly(e.target.checked)} style={{accentColor:'#1e3a5f'}}/> Show only invoices with issues</label>

  </div>;
}

// ── Receipt / Payment Form (receipts: against invoice + TDS) ──
function RecPayForm({data,onSave,onClose,type,customers=[],invoices=[],receipts=[]}){
  const isR=type==='receipt';
  const nk=isR?'receiptNo':'paymentNo';const pk=isR?'receivedFrom':'paidTo';
  const meta=recMeta(data||{});
  const[f,set]=useState(()=>({[nk]:'',[pk]:'',date:today(),amount:0,mode:'Bank',...data,description:isR?meta.note:(data?.description||''),
    invRefs:(data&&data.invRefs)||meta.inv,tds:data&&data.tds!=null?data.tds:meta.tds}));
  const[pct,setPct]=useState(2);
  const A=useMemo(()=>isR?allocate(invoices.map(enrichInv),receipts.filter(r=>r.id!==f.id)):null,[invoices,receipts,f.id]);
  const party=A?A.parties[normName(f[pk])]:null;
  const isSel=b=>f.invRefs.some(n=>normRef(n)===normRef(b.invoiceNumber));
  const bills=party?party.bills.filter(b=>b.pending>0.5||isSel(b)):[];
  const selB=bills.filter(isSel);
  const selPending=sumBy(selB,'pending'),selTaxable=sumBy(selB,'taxableAmount');
  const settle=(+f.amount||0)+(+f.tds||0);
  const toggle=(no)=>set(p=>({...p,invRefs:p.invRefs.some(n=>normRef(n)===normRef(no))?p.invRefs.filter(n=>normRef(n)!==normRef(no)):[...p.invRefs,no]}));
  const applyTDS=()=>{const t=r2(selTaxable*(+pct||0)/100);set(p=>({...p,tds:t,amount:r2(Math.max(0,selPending-t))}));};
  const save=()=>{const{invRefs,tds,...rest}=f;onSave(isR?{...rest,amount:+rest.amount||0,description:recDesc(f.description,invRefs,tds)}:rest);};
  const lbl={...S.lbl};
  return <div>
    {isR&&<datalist id="rec-party">{customers.map(c=><option key={c.id} value={c.name}/>)}</datalist>}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
      <div><label style={lbl}>{isR?'Receipt':'Payment'} #</label><input style={S.inp} value={f[nk]||''} onChange={e=>set(p=>({...p,[nk]:e.target.value}))}/></div>
      <div><label style={lbl}>Date</label><input style={S.inp} type="date" value={f.date} onChange={e=>set(p=>({...p,date:e.target.value}))}/></div>
      <div><label style={lbl}>{isR?'Received From':'Paid To'}</label><input list={isR?'rec-party':undefined} style={S.inp} value={f[pk]||''} onChange={e=>set(p=>({...p,[pk]:e.target.value,invRefs:[]}))}/>
        {isR&&f[pk]&&!party&&<div style={{fontSize:11,color:'#b45309',marginTop:4,fontWeight:600}}>⚠ No invoices under this name — the receipt won't be applied to any bill</div>}</div>
      <div><label style={lbl}>Amount received ₹ {isR&&<span style={{fontWeight:400,color:'#94a3b8'}}>(net of TDS)</span>}</label><input style={S.inp} type="number" step="0.01" value={f.amount} onChange={e=>set(p=>({...p,amount:e.target.value}))}/></div>
      <div><label style={lbl}>Mode</label><select style={S.inp} value={f.mode} onChange={e=>set(p=>({...p,mode:e.target.value}))}><option>Cash</option><option>Bank</option><option>UPI</option><option>Cheque</option><option>Card</option></select></div>
      {isR&&<div><label style={lbl}>TDS deducted by party ₹</label><input style={S.inp} type="number" step="0.01" value={f.tds} onChange={e=>set(p=>({...p,tds:e.target.value}))}/></div>}
    </div>
    {isR&&party&&<div style={{marginTop:16,border:'1px solid #e2e8f0',borderRadius:12,overflow:'hidden'}}>
      <div style={{padding:'10px 14px',background:'#f8fafc',display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:8,alignItems:'center'}}>
        <b style={{fontSize:13}}>Against invoice(s) <span style={{fontWeight:400,color:'#64748b'}}>— leave unticked to settle the oldest bills first</span></b>
        <span style={{fontSize:12,color:'#64748b'}}>{fCur(party.pending)} pending on {party.openCount} bills</span></div>
      {bills.map(b=><label key={b.id} style={{display:'flex',gap:10,alignItems:'center',padding:'8px 14px',borderTop:'1px solid #f1f5f9',cursor:'pointer',fontSize:13}}>
        <input type="checkbox" checked={isSel(b)} onChange={()=>toggle(b.invoiceNumber)} style={{accentColor:'#1e3a5f'}}/>
        <b style={{minWidth:70}}>{b.invoiceNumber}</b><span style={{color:'#64748b',minWidth:90}}>{fDate(b.invoiceDate)}</span>
        <span style={{flex:1,color:'#64748b'}}>{b._com?b._com.side+' · '+fMT(b._mt)+' MT':''}</span>
        <span style={{fontVariantNumeric:'tabular-nums'}}>bill {fCur(b.value)}</span><b style={{fontVariantNumeric:'tabular-nums',color:'#b45309',minWidth:110,textAlign:'right'}}>{fCur(b.pending)}</b></label>)}
      {!bills.length&&<div style={{padding:14,fontSize:13,color:'#059669'}}>✓ All bills of this party are settled — this receipt will sit as an advance</div>}
      {selB.length>0&&<div style={{padding:'10px 14px',borderTop:'1px solid #e2e8f0',background:'#fffcf2',display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',fontSize:13}}>
        <span>Selected pending <b>{fCur(selPending)}</b> · taxable {fCur(selTaxable)}</span>
        <span style={{marginLeft:'auto'}}>TDS u/s 194H @ <input type="number" step="0.1" value={pct} onChange={e=>setPct(e.target.value)} style={{...S.inp,width:64,padding:'5px 8px',display:'inline-block'}}/> % on taxable</span>
        <button type="button" style={{...S.btnS,...S.btnSm,fontSize:12}} onClick={applyTDS}>Apply</button>
      </div>}
    </div>}
    {isR&&party&&settle>0&&<div style={{marginTop:10,fontSize:13,padding:'8px 12px',borderRadius:8,background:'#f1f5f9'}}>
      Settles <b>{fCur(settle)}</b>{+f.tds>0?' ('+fCur(f.amount)+' received + '+fCur(f.tds)+' TDS)':''}
      {selB.length>0&&(selPending-settle>0.5?<span style={{color:'#b45309'}}> · leaves {fCur(selPending-settle)} pending on the selected bills</span>:settle-selPending>0.5?<span style={{color:'#1d4ed8'}}> · {fCur(settle-selPending)} more than selected — the excess goes to the next oldest bill</span>:<span style={{color:'#059669'}}> · selected bills fully settled</span>)}
    </div>}
    <div style={{marginTop:14}}><label style={lbl}>Description</label><textarea style={{...S.inp,minHeight:50}} value={f.description||''} onChange={e=>set(p=>({...p,description:e.target.value}))}/></div>
    <div style={{display:'flex',gap:12,justifyContent:'flex-end',marginTop:20}}>
      <button style={S.btnS} onClick={onClose}>Cancel</button>
      <button style={S.btnP} onClick={save}><Ic name="save" size={16}/> Save & Sync</button>
    </div>
  </div>;
}

// ══════════════════════════════════════
// INVOICE HTML BUILDER (shared by View, Print, PDF Email)
// ══════════════════════════════════════
function buildInvoiceHTML(inv,company,forPdf=false){
  const isIGST=(+inv.igstAmount||0)>0||(!!inv.customerStateCode&&!!company.stateCode&&inv.customerStateCode!==company.stateCode);
  const items=inv.items||[];const com=getCommission(inv);
  const rates=[...new Set(items.map(i=>+i.gstRate||0))];const one=rates.length===1?rates[0]:null;
  const exact=r2((+inv.taxableAmount||0)+(+inv.cgstAmount||0)+(+inv.sgstAmount||0)+(+inv.igstAmount||0));
  const ro=r2((+inv.grandTotal||0)-exact);
  const title={'Credit Note':'CREDIT NOTE','Debit Note':'DEBIT NOTE','Export':'TAX INVOICE — EXPORT'}[inv.invoiceType]||'TAX INVOICE';
  const pos=STATES.find(s=>s.c===inv.customerStateCode);
  const itemsHTML=items.map((it,i)=>{
    const tx=r2((+it.qty||0)*(+it.rate||0));const g=r2(tx*(+it.gstRate||0)/100);
    const code=it.hsn?'<div class="sm">'+(/^99/.test(String(it.hsn))?'SAC':'HSN')+': '+esc(it.hsn)+'</div>':'';
    const qty=(TON_FACTOR[it.unit]&&it.unit!=='KGS')?fMT(it.qty):esc(it.qty);
    return '<tr><td>'+(i+1)+'</td><td><b>'+esc(it.productName)+'</b>'+code+'</td><td class="r">'+qty+' '+esc(it.unit||'')+'</td><td class="r">'+fCur(it.rate)+'</td><td class="r">'+fCur(tx)+'</td><td class="r">'+(+it.gstRate||0)+'%</td><td class="r">'+fCur(g)+'</td><td class="r"><b>'+fCur(tx+g)+'</b></td></tr>';
  }).join('');
  let refsHTML='';
  if(com&&(com.refs||[]).length){
    const refs=com.refs;const hasDate=refs.some(r=>r.date);
    const half=refs.length>8?Math.ceil(refs.length/2):refs.length;
    const tbl=(arr,off)=>'<table class="refs"><thead><tr><th style="width:24px">#</th><th>Invoice no</th>'+(hasDate?'<th>Date</th>':'')+'<th class="r">Qty (MT)</th></tr></thead><tbody>'+
      arr.map((r,i)=>'<tr><td>'+(off+i+1)+'</td><td class="mono">'+esc(r.no)+'</td>'+(hasDate?'<td>'+(r.date?fDate(r.date):'')+'</td>':'')+'<td class="r mono">'+fMT(r.mt)+'</td></tr>').join('')+'</tbody></table>';
    refsHTML='<div class="refwrap"><div class="sec">Invoice details with tonnage</div>'+
      '<div class="parties"><div><span>Billed from (supplier)</span>'+esc(com.supplier)+'</div><div><span>Billed to (buyer)</span>'+esc(com.buyer)+'</div><div><span>Commission charged to</span>'+esc(com.side)+' @ '+fCur(com.rate)+' per MT</div></div>'+
      '<div class="refcols">'+tbl(refs.slice(0,half),0)+(refs.length>half?tbl(refs.slice(half),half):'')+'</div>'+
      '<div class="reftot">Total tonnage <b>'+fMT(sumMT(refs))+' MT</b> across '+refs.length+' invoice'+(refs.length>1?'s':'')+'</div></div>';
  }
  const lbl=(n,div)=>one!==null&&one>0?n+' @ '+(+(one/div).toFixed(3))+'%':n;
  const row=(l,v)=>'<tr><td>'+l+'</td><td class="r mono">'+v+'</td></tr>';
  let taxRows=isIGST?row(lbl('IGST',1),fCur(inv.igstAmount)):row(lbl('CGST',2),fCur(inv.cgstAmount))+row(lbl('SGST',2),fCur(inv.sgstAmount));
  if(Math.abs(ro)>=0.005)taxRows+=row('Round off',(ro<0?'(−) ':'(+) ')+fCur(Math.abs(ro)));

  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${esc(inv.invoiceNumber||'Invoice')}</title><style>
  @page{size:A4;margin:10mm}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-family:Arial,'Helvetica Neue',sans-serif;color:#1a1a2e;line-height:1.45;background:#fff;${forPdf?'':'padding:10px;'}}
  @media print{body{padding:0}}
  .pg{max-width:780px;margin:0 auto}
  .mono{font-family:Consolas,'Courier New',monospace}
  .r{text-align:right}
  .hdr{display:flex;justify-content:space-between;gap:20px;padding:26px 30px 22px;background:#1e3a5f;color:#fff;border-bottom:4px solid #c9a227}
  .hdr h1{font-size:19px;letter-spacing:.3px;margin-bottom:3px}
  .hdr .g{font-family:Consolas,monospace;font-size:11px;opacity:.75;margin-bottom:5px}
  .hdr .a{font-size:11.5px;opacity:.85;line-height:1.55;max-width:380px}
  .hdr .t{text-align:right}
  .hdr .tt{font-size:15px;font-weight:700;letter-spacing:2px;color:#f3d77a}
  .hdr .st{font-size:10px;opacity:.75;margin:2px 0 10px}
  .hdr .no{font-family:Consolas,monospace;font-size:22px;font-weight:700}
  .hdr .dt{font-size:11.5px;opacity:.85;line-height:1.7}
  .bill{display:flex;gap:16px;padding:18px 30px;border-bottom:1px solid #e5e7eb}
  .bill>div{flex:1}
  .sec{font-size:9.5px;font-weight:700;letter-spacing:1.2px;color:#1e3a5f;text-transform:uppercase;margin-bottom:5px}
  .nm{font-size:14px;font-weight:700;margin-bottom:2px}
  .dl{font-size:12px;color:#4a4a6a}
  .pos{background:#f8fafc;border:1px solid #e5e7eb;border-radius:6px;padding:10px 12px;max-width:240px}
  .pos div{font-size:12px;display:flex;justify-content:space-between;gap:10px;padding:1px 0}
  .pos span{color:#6b7280}
  .items{width:calc(100% - 60px);margin:0 30px;border-collapse:collapse}
  .items th{text-align:left;font-size:9px;font-weight:700;letter-spacing:.6px;color:#6b7280;text-transform:uppercase;padding:12px 8px 7px;border-bottom:2px solid #1e3a5f}
  .items th.r{text-align:right}
  .items td{padding:10px 8px;border-bottom:1px solid #eef0f4;font-size:12.5px;vertical-align:top}
  .items td.r{font-family:Consolas,monospace;font-size:12px}
  .sm{font-family:Consolas,monospace;font-size:10.5px;color:#6b7280;margin-top:2px}
  .refwrap{margin:14px 30px 0;border:1px solid #e8dcae;border-radius:8px;padding:12px 14px;background:#fffcf2}
  .parties{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px}
  .parties div{font-size:11.5px;font-weight:700;flex:1;min-width:160px}
  .parties span{display:block;font-size:9.5px;font-weight:400;color:#6b7280}
  .refcols{display:flex;gap:14px;align-items:flex-start}
  .refs{flex:1;border-collapse:collapse}
  .refs th{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;text-align:left;padding:4px 6px;border-bottom:1px solid #e8dcae}
  .refs th.r{text-align:right}
  .refs td{font-size:11px;padding:3px 6px;border-bottom:1px solid #f3ecd2}
  .reftot{margin-top:8px;font-size:12px;text-align:right}
  .tot{display:flex;justify-content:space-between;gap:24px;padding:16px 30px 0}
  .words{flex:1;font-size:12px;color:#4a4a6a;font-style:italic;padding-top:4px}
  .tot table{width:300px;border-collapse:collapse}
  .tot td{padding:4px 0;font-size:12.5px}
  .tot td.r{font-family:Consolas,monospace}
  .tot tr.g td{border-top:2px solid #1e3a5f;padding-top:8px;font-weight:700;font-size:15px}
  .tot tr.g td.r{color:#1e3a5f}
  .notes{padding:14px 30px 0;font-size:11.5px;color:#4a4a6a}
  .foot{display:flex;justify-content:space-between;gap:20px;padding:18px 30px;margin-top:16px;border-top:1px solid #e5e7eb;background:#fafbfc}
  .bk{font-size:12px;color:#4a4a6a;line-height:1.7}
  .sig{text-align:right;display:flex;flex-direction:column;justify-content:space-between;min-height:80px}
  .sig .f{font-size:12px;font-weight:700}
  .sig .s{font-size:11px;color:#6b7280;border-top:1px solid #9ca3af;padding-top:4px;margin-top:36px}
  .cg{text-align:center;font-size:10px;color:#9ca3af;padding:8px 0 4px}
  </style></head><body><div class="pg">
  <div class="hdr">
    <div><h1>${esc(company.companyName||'YOUR COMPANY')}</h1>
      <div class="g">GSTIN: ${esc(company.gstin||'—')} | PAN: ${esc(company.pan||'—')}</div>
      <div class="a">${esc(company.address||'').replace(/\n/g,'<br>')}<br>${esc(company.city||'')}${company.city?', ':''}${esc(company.state||'')} ${company.stateCode?'('+esc(company.stateCode)+')':''}<br>${company.phone?'Ph: '+esc(company.phone):''}${company.email?' · '+esc(company.email):''}</div></div>
    <div class="t"><div class="tt">${title}</div><div class="st">${esc(inv.invoiceType||'B2B')} · Original for recipient</div>
      <div class="dt">Invoice no.</div><div class="no">${esc(inv.invoiceNumber||'')}</div>
      <div class="dt">Date: <b>${fDate(inv.invoiceDate)}</b>${inv.dueDate?'<br>Due: <b>'+fDate(inv.dueDate)+'</b>':''}</div></div>
  </div>
  <div class="bill">
    <div><div class="sec">Bill to</div><div class="nm">${esc(inv.customerName||'')}</div>
      <div class="dl">${esc(inv.customerAddress||'')}</div>
      <div class="dl">${esc(inv.customerState||'')} ${inv.customerStateCode?'('+esc(inv.customerStateCode)+')':''}</div>
      ${inv.customerGstin?'<div class="dl mono" style="margin-top:3px">GSTIN: '+esc(inv.customerGstin)+'</div>':''}
      ${inv.customerPhone?'<div class="dl">Ph: '+esc(inv.customerPhone)+'</div>':''}</div>
    <div class="pos"><div class="sec">Supply</div>
      <div><span>Place of supply</span><b>${pos?esc(pos.n)+' ('+pos.c+')':'—'}</b></div>
      <div><span>Supply type</span><b>${isIGST?'Inter-state':'Intra-state'}</b></div>
      <div><span>Reverse charge</span><b>No</b></div></div>
  </div>
  <table class="items"><thead><tr><th style="width:26px">#</th><th>Description</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Taxable</th><th class="r">GST%</th><th class="r">GST amt</th><th class="r">Total</th></tr></thead><tbody>${itemsHTML}</tbody></table>
  ${refsHTML}
  <div class="tot"><div class="words">${numWords(inv.grandTotal)}</div>
    <table>${row('Taxable amount',fCur(inv.taxableAmount))}${taxRows}<tr class="g"><td>Grand total</td><td class="r">${fCur(inv.grandTotal)}</td></tr></table></div>
  ${inv.notes?'<div class="notes"><b>Notes:</b> '+esc(inv.notes)+'</div>':''}
  <div class="foot">
    <div><div class="sec">Bank details</div><div class="bk"><b>${esc(company.bankName||'—')}</b><br>A/c: <span class="mono">${esc(company.accountNo||'—')}</span><br>IFSC: <span class="mono">${esc(company.ifsc||'—')}</span></div></div>
    <div class="sig"><div class="f">For ${esc(company.companyName||'')}</div><div class="s">Authorised signatory</div></div>
  </div>
  <div class="cg">This is a computer-generated invoice.</div>
  </div></body></html>`;
}

// ══════════════════════════════════════
// INVOICE VIEW + PRINT + EMAIL PDF
// ══════════════════════════════════════
function InvView({inv,company,api,notify,onBillOther}){
  const[sending,setSending]=useState(false);
  const[emailTo,setEmailTo]=useState('');
  const[showEmail,setShowEmail]=useState(false);
  const[h,setH]=useState(1000);
  const html=useMemo(()=>buildInvoiceHTML(inv,company,false),[inv,company]);
  const com=getCommission(inv);
  const doPrint=()=>{const w=window.open('','','width=860,height=900');w.document.write(html);w.document.close();setTimeout(()=>w.print(),400);};
  const doSendEmail=async()=>{
    if(!emailTo||!emailTo.includes('@')){notify&&notify("Enter a valid email address","warning");return;}
    setSending(true);
    try{
      const r=await api('sendInvoicePdf',{invoiceNumber:inv.invoiceNumber,customerName:inv.customerName,emailTo,invoiceHtml:buildInvoiceHTML(inv,company,true),companyName:company.companyName||'',grandTotal:inv.grandTotal});
      if(r?.success){notify&&notify("✓ Invoice PDF sent to "+emailTo,"success");setShowEmail(false);setEmailTo('');}
      else notify&&notify(r?.error||"Failed to send email","error");
    }catch(e){notify&&notify("Network error sending email","error");}
    setSending(false);
  };
  return <div>
    <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginBottom:16,flexWrap:'wrap'}}>
      {com&&onBillOther&&<button style={{...S.btnS,borderColor:'#c9a227'}} onClick={()=>onBillOther(inv)}>Bill the {com.side==='Buyer'?'supplier':'buyer'} for these invoices</button>}
      <button style={S.btnS} onClick={doPrint}><Ic name="print" size={16}/> Print / PDF</button>
      <button style={S.btnP} onClick={()=>setShowEmail(!showEmail)}><Ic name="receipt" size={16}/> Send invoice as PDF</button>
    </div>
    {showEmail&&<div style={{padding:16,background:'#eff6ff',borderRadius:12,border:'1px solid #bfdbfe',marginBottom:16}}>
      <div style={{fontSize:14,fontWeight:700,color:'#1e3a5f',marginBottom:10}}>Send invoice PDF by email</div>
      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
        <input style={{...S.inp,flex:1,minWidth:200}} type="email" placeholder="recipient@example.com" value={emailTo} onChange={e=>setEmailTo(e.target.value)}/>
        <button style={{...S.btnP,opacity:sending?.6:1}} onClick={doSendEmail} disabled={sending}>{sending?'Sending…':'Send now'}</button>
      </div>
    </div>}
    <iframe title="Invoice preview" srcDoc={html} style={{width:'100%',height:h,border:'1px solid #e2e8f0',borderRadius:12,background:'#fff'}}
      onLoad={e=>{try{setH(e.target.contentDocument.documentElement.scrollHeight+6);}catch(err){}}}/>
  </div>;
}

// SETTINGS PAGE
// ══════════════════════════════════════
function SettingsPage({url,setUrl,sid,setSid,conn,syncing,connect,fullSync,backup,company,setCo,notify,lastSync}){
  return <div style={{maxWidth:640}}>
    <h2 style={{fontSize:22,fontWeight:800,margin:'0 0 20px'}}>Settings</h2>
    <div style={{...S.card,padding:24,marginBottom:20}}>
      <h3 style={{fontSize:16,fontWeight:700,margin:'0 0 16px'}}>🔗 Google Sheet Connection</h3>
      <div style={{marginBottom:14}}><label style={S.lbl}>Web App URL</label><input style={S.inp} value={url} onChange={e=>setUrl(e.target.value)}/></div>
      <div style={{marginBottom:14}}><label style={S.lbl}>Sheet ID</label><input style={S.inp} value={sid} onChange={e=>setSid(e.target.value)}/></div>
      <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
        <button style={S.btnP} onClick={connect} disabled={syncing}><Ic name="link" size={16}/> {syncing?'...':'Reconnect'}</button>
        {conn&&<button style={S.btnS} onClick={fullSync} disabled={syncing}><Ic name="sync" size={16}/> Pull from Sheet</button>}
        {conn&&<button style={S.btnS} onClick={backup} disabled={syncing}><Ic name="cloud" size={16}/> Push All to Sheet</button>}
      </div>
      {conn&&<div style={{marginTop:12,padding:10,background:'#ecfdf5',borderRadius:8,display:'flex',alignItems:'center',gap:8,fontSize:13}}>
        <div style={{width:10,height:10,borderRadius:'50%',background:'#059669'}}/>
        <span style={{color:'#059669',fontWeight:600}}>Connected</span>
        {lastSync&&<span style={{color:'#64748b',marginLeft:8}}>Last sync: {lastSync}</span>}
      </div>}
    </div>
    <div style={{...S.card,padding:24}}>
      <h3 style={{fontSize:16,fontWeight:700,margin:'0 0 16px'}}>🏢 Company Profile</h3>
      {[['companyName','Company Name'],['gstin','GSTIN'],['pan','PAN'],['address','Address'],['city','City'],['phone','Phone'],['email','Email'],['bankName','Bank Name'],['accountNo','Account No'],['ifsc','IFSC Code']].map(([k,l])=>
        <div key={k} style={{marginBottom:12}}><label style={S.lbl}>{l}</label>
          {k==='state'?<select style={S.inp} value={company[k]||''} onChange={e=>{const v=e.target.value;const s=STATES.find(x=>x.n===v);setCo(p=>({...p,state:v,stateCode:s?.c||''}));}}>
            <option value="">Select</option>{STATES.map(s=><option key={s.c} value={s.n}>{s.n} ({s.c})</option>)}</select>
          :<input style={S.inp} value={company[k]||''} onChange={e=>setCo(p=>({...p,[k]:e.target.value}))}/>}
        </div>
      )}
      <div style={{marginBottom:12}}><label style={S.lbl}>State</label>
        <select style={S.inp} value={company.state||''} onChange={e=>{const v=e.target.value;const s=STATES.find(x=>x.n===v);setCo(p=>({...p,state:v,stateCode:s?.c||''}));}}>
          <option value="">Select</option>{STATES.map(s=><option key={s.c} value={s.n}>{s.n} ({s.c})</option>)}</select>
      </div>
      <button style={S.btnP} onClick={()=>{LS.set('company',company);notify("Company profile saved","success");}}><Ic name="save" size={16}/> Save Company Profile</button>
    </div>
  </div>;
}
