<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Password hash</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;color:#1e293b}input{width:100%;padding:10px;font-size:15px;border:1.5px solid #cbd5e1;border-radius:8px}code{display:block;word-break:break-all;background:#f1f5f9;padding:12px;border-radius:8px;margin-top:12px;font-size:13px}</style></head>
<body><h2>Make a password hash</h2><p>Type the new password. Copy the hash into the <b>USERS_TABLE</b> line for that user in <b>index.html</b> (<code style="display:inline;padding:2px 4px">hash:'…'</code>). Nothing leaves this page.</p>
<input id="p" type="password" placeholder="New password" autocomplete="new-password"><code id="o">—</code>
<script>p.oninput=async()=>{if(!p.value){o.textContent='—';return;}const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p.value));o.textContent=[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('');};</script></body></html>
